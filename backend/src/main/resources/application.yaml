spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/neuratransit
    username: neura_user
    password: SIH2026
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: anpr-backend
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.amigos.backend.*"

server:
  port: 8080

anpr:
  internal-api-key: "local-dev-internal-key-change-me"
  jwt-secret: "change-this-to-a-long-random-secret-at-least-32-bytes-for-local-dev"
  jwt-expiration-ms: 3600000
  refresh-token-expiration-days: 7
